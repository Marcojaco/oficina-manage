<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../js/authGuard.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQR Mecânica — Veículo</title>
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand sidebar-brand"><span class="brand-mark">H</span><div><strong>HQR Mecânica</strong><small>Gestão da oficina</small></div></div>
    <nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="clientes.html">Clientes</a><a class="nav-link active" href="veiculos.html">Veículos</a><a class="nav-link" href="ordens-servico.html">Ordens de serviço</a><a class="nav-link" href="agenda.html">Agenda</a></nav>
    <button id="btn-logout" class="nav-link nav-button">Sair</button>
  </aside>
  <main class="content">
    <header class="topbar"><div><h1 id="titulo-form">Novo veículo</h1><p class="muted">Preencha os dados do veículo.</p></div><a class="btn btn-secondary" href="veiculos.html">← VOLTAR</a></header>
    <div id="mensagem" class="mensagem" role="alert"></div>
    <section class="panel form-panel">
      <form id="form-veiculo" class="form-grid">
        <div class="field full">
          <label for="cliente-veiculo">Cliente</label>
          <select id="cliente-veiculo" required><option value="">Carregando clientes...</option></select>
        </div>
        <div class="field"><label for="placa-veiculo">Placa</label><input id="placa-veiculo" maxlength="8" placeholder="ABC1D23" required></div>
        <div class="field"><label for="marca-veiculo">Marca</label><input id="marca-veiculo" maxlength="60" required></div>
        <div class="field"><label for="modelo-veiculo">Modelo</label><input id="modelo-veiculo" maxlength="60" required></div>
        <div class="field"><label for="ano-veiculo">Ano</label><input id="ano-veiculo" type="number" min="1950" required></div>
        <div class="field"><label for="km-veiculo">Quilometragem</label><input id="km-veiculo" type="number" min="0" placeholder="Opcional"></div>
        <div class="field"><label for="chassi-veiculo">Chassi</label><input id="chassi-veiculo" maxlength="17" placeholder="Opcional — 17 caracteres"></div>
        <div class="field"><label for="renavam-veiculo">Renavam</label><input id="renavam-veiculo" maxlength="11" placeholder="Opcional — 11 dígitos"></div>
        <div class="field full"><label for="obs-veiculo">Observações</label><input id="obs-veiculo" maxlength="500" placeholder="Opcional"></div>
        <div class="form-actions full"><a class="btn btn-secondary" href="veiculos.html">CANCELAR</a><button id="btn-salvar" class="btn btn-primary" type="submit">CADASTRAR</button></div>
      </form>
    </section>
  </main>
</div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/veiculo-form.js"></script>
</body>
</html>
