<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQR Mecânica — Registro</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div><strong>HQR Mecânica</strong><small>Gestão da oficina</small></div>
    </div>
    <h1>Criar conta</h1>
    <p class="muted">Cadastre o acesso ao sistema.</p>
    <div id="mensagem" class="mensagem" role="alert"></div>
    <form id="registro-form">
      <label for="nome">Nome</label>
      <input id="nome" type="text" autocomplete="name" required>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="new-password" minlength="6" required>
      <button id="btn-registro" class="btn btn-primary" type="submit">CRIAR CONTA</button>
    </form>
    <p class="auth-link">Já possui conta? <a href="index.html">Voltar ao login</a></p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
