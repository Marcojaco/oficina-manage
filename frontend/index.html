<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQR Mecânica — Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div><strong>HQR Mecânica</strong><small>Gestão da oficina</small></div>
    </div>
    <h1>Entrar</h1>
    <p class="muted">Acesse o sistema da oficina.</p>
    <div id="mensagem" class="mensagem" role="alert"></div>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button id="btn-login" class="btn btn-primary" type="submit">ENTRAR</button>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
